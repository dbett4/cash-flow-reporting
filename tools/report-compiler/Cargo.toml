[package]
name = "acfr-report-compiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
calamine = "0.36.1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
